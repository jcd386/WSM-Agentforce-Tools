<template>
    <div class="wsm-calc">
        <div class="wsm-bar">
            <div class="wsm-bar-modes" role="group" aria-label="Billing shape">
                <template for:each={modeOptions} for:item="opt">
                    <button
                        key={opt.value}
                        type="button"
                        class={opt.cls}
                        data-mode={opt.value}
                        aria-pressed={opt.selected}
                        onclick={handleModeClick}
                    >
                        <span class="wsm-seg-label">{opt.label}</span>
                        <span class="wsm-seg-detail">{opt.detail}</span>
                    </button>
                </template>
            </div>
            <div class="wsm-env">
                <div class="wsm-env-label">
                    <span>Environment</span>
                    <lightning-helptext
                        content={environmentHelp}
                        alternative-text="What does the environment setting affect?"
                    ></lightning-helptext>
                </div>
                <lightning-radio-group
                    name="environment"
                    label="Environment"
                    variant="label-hidden"
                    type="button"
                    options={environmentOptions}
                    value={environment}
                    onchange={handleEnvironmentChange}
                ></lightning-radio-group>
            </div>
            <lightning-button
                class="wsm-reset"
                label="Reset"
                variant="neutral"
                onclick={handleReset}
            ></lightning-button>
        </div>

        <div class="wsm-split">
            <div class="wsm-col-inputs">
                <div class="wsm-panel">
                    <template lwc:if={showEventInputs}>
                        <div class="wsm-field">
                            <lightning-combobox
                                label="Event type"
                                options={flatEventOptions}
                                value={flatEventKey}
                                onchange={handleFlatEventChange}
                            ></lightning-combobox>
                        </div>
                    </template>

                    <template lwc:if={isBlendedMode}>
                        <div class="wsm-field">
                            <lightning-input
                                type="number"
                                label="Agent actions per request"
                                data-field="actions"
                                value={raw.actions}
                                min="0"
                                onchange={handleRawChange}
                            ></lightning-input>
                        </div>
                    </template>

                    <div class={tokenFieldClass}>
                        <lightning-input
                            type="number"
                            label="Tokens per prompt request"
                            data-field="exactTokens"
                            value={raw.exactTokens}
                            disabled={tokensDisabled}
                            placeholder="Blank uses the value below"
                            onchange={handleRawChange}
                        ></lightning-input>
                        <template lwc:if={tokensDisabled}>
                            <p class="wsm-field-off-note">Not used &mdash; flat rate.</p>
                        </template>
                    </div>

                    <div class={tokenFieldClass}>
                        <lightning-radio-group
                            class="wsm-chips"
                            name="commonTokens"
                            label="Common values"
                            type="button"
                            options={tokenOptions}
                            value={commonTokens}
                            disabled={tokensDisabled}
                            onchange={handleCommonTokensChange}
                        ></lightning-radio-group>
                    </div>

                    <template lwc:if={showPromptInputs}>
                        <div class="wsm-field">
                            <lightning-radio-group
                                class="wsm-chips"
                                name="promptTier"
                                label="Prompt tier"
                                type="button"
                                options={promptTierOptions}
                                value={promptTierKey}
                                onchange={handlePromptTierChange}
                            ></lightning-radio-group>
                        </div>
                    </template>

                    <div class="wsm-pair">
                        <lightning-input
                            type="number"
                            label="Monthly requests"
                            data-field="monthlyRequests"
                            value={raw.monthlyRequests}
                            min="0"
                            field-level-help="Drives the monthly and yearly rows. Blank is treated as zero."
                            onchange={handleRawChange}
                        ></lightning-input>
                        <lightning-input
                            type="number"
                            label="Uplift %"
                            data-field="uplift"
                            value={raw.uplift}
                            step="0.1"
                            field-level-help="For add-ons billed as a percent of total spend, such as Shield. Applied on top of the dollar figures. It does not change credits consumed."
                            onchange={handleRawChange}
                        ></lightning-input>
                    </div>
                    <div class="wsm-pair">
                        <lightning-input
                            type="number"
                            label="Discount %"
                            value={raw.discountPct}
                            step="0.1"
                            field-level-help="Enter the discount off list. 20 means 20% off, i.e. $400 per 100,000 credits."
                            onchange={handleDiscountChange}
                        ></lightning-input>
                        <lightning-input
                            type="number"
                            label="Negotiated $ / 100K"
                            data-field="negotiated"
                            value={raw.negotiated}
                            step="0.01"
                            field-level-help="The rate this customer actually gets. Blank or 500 is list price."
                            onchange={handleRawChange}
                        ></lightning-input>
                    </div>
                    <p class="wsm-hint">
                        Discount and negotiated rate are linked &mdash; enter whichever you know.
                        List is $500.00 per 100,000 credits ($0.005 per credit, 200 credits per
                        $1.00). Blank monthly requests = 0.
                    </p>
                </div>
            </div>

            <div class="wsm-col-results">
                <div class={formulaClass}>
                    <span class="wsm-formula-text">{viewModel.formula}</span>
                </div>
                <c-wsm-credit-result-grid model={viewModel}></c-wsm-credit-result-grid>
            </div>
        </div>

        <c-wsm-rate-card-reference></c-wsm-rate-card-reference>

        <p class="wsm-provenance">
            Rates from the Salesforce Flex Credits rate card effective
            <strong>{rateCardVersion}</strong>, last verified <strong>{ratesVerified}</strong>.
            Salesforce republishes without notice &mdash; confirm against
            <a href={rateCardSourceUrl} target="_blank" rel="noopener noreferrer">agentforce/rates</a>&nbsp;and&nbsp;<a href={pricingSourceUrl} target="_blank" rel="noopener noreferrer">agentforce/pricing</a>&nbsp;before quoting.
        </p>
    </div>
</template>
